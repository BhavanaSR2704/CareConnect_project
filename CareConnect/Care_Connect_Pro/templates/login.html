<!DOCTYPE HTML>
<html lang="en">
    <head>
        <title>Login Form </title>
        <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
        <link href='https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css' rel='stylesheet'>
    </head>
    <body>
        <div class="flash-wrap">{% with messages = get_flashed_messages() %}{% for message in messages %}<div class="flash">{{ message }}</div>{% endfor %}{% endwith %}</div>
        <div class="login-container">
            <form name="login_form" action="{{ url_for('login') }}" method="post">
                <h1> Login </h1>
                <div class="input-box">
                    <input type="text" name="username" placeholder="Username" autocomplete="username" required>
                    <i class='bx  bxs-user'></i> 
        </div>
        <div class="input-box">
                    <input type="password" name="password" placeholder="Password" autocomplete="current-password" required>
                    <i class='bx  bxs-lock-alt'></i> 
         </div>
         <div class="remeber">
            <lable><input type="checkbox"> Remember Me </lable>
            <a href="{{ url_for('register') }}"> Create an account </a>
         </div>
         <button type="submit" class="btn"> Login </button>
         <div class="reg-link">
            <p> Don't Have An Account ? <a href="{{ url_for('register') }}"> Register </a></p>
         </div>
         </form>
      </div>
    </body>
</html>
