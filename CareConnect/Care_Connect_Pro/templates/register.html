<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Register - Tiptur Health Care Hub</title><link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}"><link href="https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css" rel="stylesheet"><style>.login-container{margin:7vh auto}.login-container input{box-sizing:border-box;padding:0 16px}.login-container .input-box input{padding-left:16px}</style></head><body><div class="login-container"><h1>Create Account</h1>{% with messages=get_flashed_messages() %}{% for message in messages %}<p style="color:#7ee7ff;text-align:center">{{ message }}</p>{% endfor %}{% endwith %}<form method="post" action="{{ url_for('register') }}"><div class="input-box"><input name="username" placeholder="Choose username" required minlength="3" autocomplete="username"></div><div class="input-box"><input type="password" name="password" placeholder="Create password (8+ characters)" required minlength="8" autocomplete="new-password"></div><div class="input-box"><input type="password" name="confirm_password" placeholder="Confirm password" required minlength="8" autocomplete="new-password"></div><button class="btn" type="submit">Register</button></form><div class="reg-link"><p>Already registered? <a href="{{ url_for('login') }}">Login</a></p></div></div></body></html>
